<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicSim — Fire/EMS Station Coverage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%92%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">Loading city data…</p>
  </div>

  <div id="onboarding-hint" hidden>
    <span>👆 Click anywhere on the map to test a new station location. The metrics update instantly.</span>
    <button type="button" id="onboarding-dismiss" aria-label="Dismiss">&times;</button>
  </div>

  <div id="panel">
    <h1>CivicSim</h1>
    <p class="subtitle">Fire/EMS station coverage — click the map to test a new station</p>

    <div class="section-label">Coverage metric</div>
    <div id="metric-controls">
      <div id="metric-toggle" role="group" aria-label="Coverage metric">
        <button type="button" class="metric-toggle-btn active" data-metric="time">Time</button>
        <button type="button" class="metric-toggle-btn" data-metric="distance">Distance</button>
      </div>
      <label for="target-slider" id="target-slider-label">Target: 5.0 min</label>
      <input type="range" id="target-slider" min="1" max="15" step="0.5" value="5" />
    </div>

    <div id="metrics"><!-- filled in by main.js --></div>

    <div class="section-label">Test stations</div>
    <div id="controls">
      <button id="undo-btn">Undo last</button>
      <button id="reset-btn">Reset</button>
    </div>

    <div id="optimizer">
      <label for="optimizer-budget">Optimize placement — new stations:</label>
      <div id="optimizer-row">
        <input type="number" id="optimizer-budget" value="3" min="1" max="10" />
        <button id="optimize-btn">Optimize</button>
      </div>
      <div id="optimizer-results"></div>
    </div>

    <div class="section-label">Legend</div>
    <div id="legend">
      <div><span class="swatch swatch-covered"></span> Within target</div>
      <div><span class="swatch swatch-outside"></span> Outside target</div>
      <div><span class="swatch swatch-unreachable"></span> Unreachable (data gap)</div>
    </div>

    <div id="status"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script type="module" src="js/webapp/main.js"></script>
</body>
</html>
